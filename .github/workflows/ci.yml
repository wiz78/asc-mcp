name: macOS tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  account-free:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: test "$(uname -m)" = arm64
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run test:macos
      - run: node scripts/audit-package.mjs
